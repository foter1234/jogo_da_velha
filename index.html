<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5a2d0c" />
  <meta name="description" content="Central de Jogos — 4º Costelão Solidário" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Costelão Jogos" />
  <title>4º Costelão Solidário</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Georgia', serif;
      background: #c8b090;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    header {
      background-image:
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
          transparent 1px, transparent 8px
        ),
        linear-gradient(to bottom, #5a2d0c, #3e1f08);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      padding: clamp(8px, 1.5vw, 14px) clamp(10px, 2vw, 28px);
      gap: clamp(8px, 1.5vw, 20px);
      min-height: clamp(70px, 10vw, 110px);
    }

    .header-logo {
      width: clamp(55px, 7vw, 95px);
      height: clamp(55px, 7vw, 95px);
      flex-shrink: 0;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-title {
      color: #f5e6c8;
      font-size: clamp(1.1rem, 3.2vw, 3rem);
      font-weight: bold;
      letter-spacing: 1px;
      flex: 1;
      min-width: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-title sup {
      font-size: 0.5em;
      vertical-align: super;
    }

    .header-apoiadores {
      color: #f5e6c8;
      font-size: clamp(0.55rem, 1vw, 0.88rem);
      letter-spacing: clamp(1px, 0.3vw, 3px);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .apoiador-diamond {
      color: #c8a96e;
      font-size: 0.75em;
    }

    .header-sponsors {
      display: flex;
      gap: clamp(6px, 1vw, 12px);
      align-items: center;
      flex-shrink: 0;
    }

    .sponsor-card {
      background: #fff;
      border-radius: 4px;
      padding: clamp(5px, 0.8vw, 10px) clamp(8px, 1.2vw, 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: clamp(80px, 10vw, 150px);
      min-height: clamp(48px, 6vw, 76px);
      gap: 4px;
    }

    .sponsor-card img {
      height: clamp(22px, 3vw, 42px);
      object-fit: contain;
    }

    .sponsor-label {
      font-size: clamp(0.42rem, 0.6vw, 0.62rem);
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    /* ══════════════════════════════
       STATS BAR
    ══════════════════════════════ */
    .stats-bar {
      background: #c8aa80;
      display: flex;
      justify-content: center;
      gap: clamp(4px, 1vw, 10px);
      padding: clamp(8px, 1.2vw, 14px) clamp(10px, 2vw, 24px);
      flex-wrap: wrap;
    }

    .stat-box {
      background: #fff;
      border-radius: 6px;
      padding: clamp(4px, 0.6vw, 8px) clamp(14px, 3vw, 34px);
      text-align: center;
      flex: 1;
      min-width: clamp(70px, 10vw, 110px);
      max-width: clamp(120px, 18vw, 200px);
    }

    .stat-label {
      font-size: clamp(0.5rem, 0.7vw, 0.65rem);
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .stat-value {
      font-size: clamp(1.1rem, 2.2vw, 1.9rem);
      font-weight: bold;
      color: #3e1f08;
      font-family: 'Georgia', serif;
      line-height: 1.2;
    }

    /* ══════════════════════════════
       MAIN
    ══════════════════════════════ */
    main {
      flex: 1;
      background: #c8b090;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 80px) clamp(12px, 3vw, 40px);
    }

    .btn-start {
      background: linear-gradient(to bottom, #b87340, #8b4e1e);
      color: #fff;
      font-size: clamp(1rem, 2.5vw, 2rem);
      font-weight: bold;
      letter-spacing: clamp(2px, 0.4vw, 5px);
      font-family: 'Georgia', serif;
      border: none;
      border-radius: clamp(8px, 1.2vw, 14px);
      padding: clamp(16px, 2.5vw, 32px) clamp(28px, 8vw, 140px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.5vw, 20px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.3);
      transition: filter 0.15s;
      width: clamp(240px, 60vw, 700px);
      max-width: 90vw;
    }

    .btn-start:hover  { filter: brightness(1.08); }
    .btn-start:active { filter: brightness(0.92); transform: translateY(1px); }

    .btn-triangle {
      width: 0;
      height: 0;
      border-top: clamp(9px, 1.1vw, 15px) solid transparent;
      border-bottom: clamp(9px, 1.1vw, 15px) solid transparent;
      border-left: clamp(14px, 1.7vw, 24px) solid #fff;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    footer {
      background: #c8aa80;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(6px, 0.8vw, 10px) clamp(10px, 2vw, 24px);
      min-height: clamp(36px, 5vw, 50px);
      gap: 8px;
      flex-wrap: wrap;
    }

    .footer-spacer { flex: 1; }

    .footer-center {
      flex: 2;
      text-align: center;
      font-size: clamp(0.55rem, 0.9vw, 0.78rem);
      color: #7a5c3a;
      letter-spacing: clamp(1px, 0.3vw, 3px);
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .footer-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      background: #d9c9b0;
      border-radius: 4px;
      padding: clamp(4px, 0.5vw, 7px) clamp(8px, 1vw, 14px);
      white-space: nowrap;
    }

    .footer-right span {
      font-size: clamp(0.45rem, 0.7vw, 0.68rem);
      color: #5a3e20;
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
    }

    .footer-right img {
      height: clamp(14px, 2vw, 24px);
      object-fit: contain;
    }

    /* ══════════════════════════════
       TELAS PEQUENAS (≤ 480px)
    ══════════════════════════════ */
    @media (max-width: 480px) {
      header {
        justify-content: center;
        text-align: center;
      }

      .header-apoiadores { display: none; }

      .header-sponsors {
        width: 100%;
        justify-content: center;
      }

      .sponsor-card {
        min-width: 100px;
        flex: 1;
      }

      .header-title {
        text-align: center;
        white-space: normal;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
      }

      .stats-bar { gap: 4px; padding: 8px; }

      .stat-box {
        padding: 4px 8px;
        max-width: none;
      }

      .btn-start {
        width: 90vw;
        padding: 18px 20px;
        font-size: 1.1rem;
        letter-spacing: 3px;
      }

      footer { justify-content: center; flex-direction: column; gap: 4px; }
      .footer-spacer { display: none; }
      .footer-center { flex: unset; }
      .footer-right { flex: unset; justify-content: center; }
    }

    /* ══════════════════════════════
       TELAS GRANDES (≥ 1920px)
    ══════════════════════════════ */
    @media (min-width: 1920px) {
      header { padding: 18px 60px; min-height: 130px; }
      .header-logo { width: 110px; height: 110px; }
      .header-title { font-size: 3.6rem; }
      .header-apoiadores { font-size: 1rem; letter-spacing: 4px; }
      .sponsor-card { min-width: 180px; min-height: 90px; padding: 12px 22px; }
      .sponsor-card img { height: 52px; }
      .sponsor-label { font-size: 0.72rem; }

      .stats-bar { padding: 18px 60px; gap: 16px; }
      .stat-box { padding: 10px 50px; max-width: 240px; }
      .stat-label { font-size: 0.78rem; }
      .stat-value { font-size: 2.4rem; }

      .btn-start { font-size: 2.4rem; padding: 40px 180px; border-radius: 18px; letter-spacing: 7px; width: 780px; }

      footer { padding: 12px 60px; min-height: 60px; }
      .footer-center { font-size: 0.9rem; letter-spacing: 4px; }
      .footer-right span { font-size: 0.78rem; }
      .footer-right img { height: 30px; }
    }

    /* ══════════════════════════════
       TELAS 4K (≥ 2560px)
    ══════════════════════════════ */
    @media (min-width: 2560px) {
      header { padding: 24px 100px; min-height: 170px; }
      .header-logo { width: 150px; height: 150px; }
      .header-title { font-size: 5rem; }
      .header-apoiadores { font-size: 1.3rem; letter-spacing: 5px; }
      .sponsor-card { min-width: 240px; min-height: 120px; }
      .sponsor-card img { height: 70px; }
      .sponsor-label { font-size: 0.9rem; }

      .stats-bar { padding: 22px 100px; gap: 20px; }
      .stat-box { padding: 14px 70px; max-width: 320px; }
      .stat-label { font-size: 1rem; }
      .stat-value { font-size: 3.2rem; }

      .btn-start { font-size: 3.2rem; padding: 55px 240px; border-radius: 22px; letter-spacing: 9px; width: 1100px; }
      .btn-triangle { border-top-width: 20px; border-bottom-width: 20px; border-left-width: 32px; }

      footer { padding: 16px 100px; min-height: 80px; }
      .footer-center { font-size: 1.2rem; }
      .footer-right span { font-size: 1rem; }
      .footer-right img { height: 40px; }
    }

    /* ══════════════════════════════
       GAMES GRID
    ══════════════════════════════ */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 320px));
      gap: clamp(16px, 3vw, 32px);
      max-width: 760px;
      width: 100%;
    }

    .game-card-costelao {
      display: block;
      text-decoration: none;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .game-card-costelao:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(0,0,0,0.25); }

    .game-card-costelao-inner {
      background: linear-gradient(135deg, #d9c9b0, #c8aa80);
      border: 2px solid #b87340;
      border-radius: 14px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 280px;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .game-card-costelao:hover .game-card-costelao-inner {
      border-color: #c8a96e;
      background: linear-gradient(135deg, #e8dcc8, #d9c9b0);
    }

    .game-icon-costelao {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }
    .mark-x {
      font-family: 'Georgia', serif;
      font-size: 52px;
      font-weight: bold;
      color: #ff4d6d;
      text-shadow: 0 0 16px rgba(255,77,109,0.4);
      line-height: 1;
    }
    .mark-o {
      font-family: 'Georgia', serif;
      font-size: 52px;
      font-weight: bold;
      color: #4dd9ff;
      text-shadow: 0 0 16px rgba(77,217,255,0.4);
      line-height: 1;
    }
    .memory-emoji-costelao {
      font-size: 52px;
      filter: drop-shadow(0 0 16px rgba(200,170,128,0.5));
    }

    .game-name-costelao {
      font-family: 'Georgia', serif;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: bold;
      color: #3e1f08;
      text-align: center;
      letter-spacing: 1px;
    }
    .game-desc-costelao {
      font-size: 0.85rem;
      color: #5a3e20;
      text-align: center;
      font-family: Arial, sans-serif;
      letter-spacing: 0.5px;
    }

    .game-btn-costelao {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 32px;
      background: linear-gradient(to bottom, #b87340, #8b4e1e);
      color: #fff;
      border-radius: 10px;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 4px 12px rgba(0,0,0,0.25);
      transition: filter 0.15s;
    }
    .game-card-costelao:hover .game-btn-costelao { filter: brightness(1.08); }

    .btn-triangle-small {
      width: 0; height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
      display: inline-block;
    }

    @media (max-width: 480px) {
      .games-grid { grid-template-columns: 1fr; max-width: 320px; }
      .game-card-costelao-inner { padding: 24px 18px; min-height: 240px; }
      .game-name-costelao { font-size: 1.2rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 42px; }
    }

    @media (min-width: 1920px) {
      .games-grid { gap: 40px; max-width: 900px; }
      .game-card-costelao-inner { padding: 44px 36px; min-height: 360px; }
      .game-name-costelao { font-size: 2.2rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 72px; }
      .game-btn-costelao { font-size: 1.3rem; padding: 16px 44px; letter-spacing: 5px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-logo">
      <img src="img/logoCostelao.png" alt="Logo Costelão Solidário" />
    </div>

    <div class="header-title">
      4<sup>o</sup> Costelão Solidário
    </div>

    <div class="header-apoiadores">
      <span class="apoiador-diamond">✦</span>
      APOIADORES
      <span class="apoiador-diamond">✦</span>
    </div>

    <div class="header-sponsors">
      <div class="sponsor-card">
        <img src="img/360.jpg" alt="Silca360 Experiência Interativa" />
        <span class="sponsor-label">Experiência Interativa</span>
      </div>
      <div class="sponsor-card">
        <img src="img/teora.png" alt="Teora Solutions Desenvolvimento" />
        <span class="sponsor-label">Desenvolvimento</span>
      </div>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-label">Tempo</div>
      <div class="stat-value">75</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Tentativas</div>
      <div class="stat-value">0 / 22</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Pares</div>
      <div class="stat-value">0 / 10</div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="games-grid">

      <!-- JOGO DA VELHA -->
      <a href="jogo_da_velha/index.html" class="game-card-costelao">
        <div class="game-card-costelao-inner">
          <div class="game-icon-costelao">
            <span class="mark-x">✕</span>
            <span class="mark-o">◯</span>
          </div>
          <h2 class="game-name-costelao">Jogo da Velha</h2>
          <p class="game-desc-costelao">Melhor de 3 — Desafie um amigo!</p><br/>
          <span class="game-btn-costelao">
            <span class="btn-triangle-small"></span>
            Jogar
          </span>
        </div>
      </a>

      <!-- JOGO DA MEMÓRIA -->
      <a href="jogo_da_memoria/index.html" class="game-card-costelao">
        <div class="game-card-costelao-inner">
          <div class="game-icon-costelao">
            <span class="memory-emoji-costelao">🧠</span>
          </div>
          <h2 class="game-name-costelao">Jogo da Memória</h2>
          <p class="game-desc-costelao">Encontre os pares antes do tempo!</p>
          <span class="game-btn-costelao">
            <span class="btn-triangle-small"></span>
            Jogar
          </span>
        </div>
      </a>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-spacer"></div>
    <div class="footer-center">COSTELÃO 2026</div>
    <div class="footer-right">
      <span>Desenvolvido por Teora Solutions</span>
      <img src="img/teora.png" alt="Teora Solutions" />
    </div>
  </footer>

  <script>
    // Registrar service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(r => console.log('[SW] registrado:', r.scope))
        .catch(e => console.warn('[SW] falha:', e));
    }
  </script>
</body>
</html>
