<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5a2d0c" />
  <meta name="description" content="Central de Jogos — 4º Costelão Solidário" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Costelão Jogos" />
  <title>4º Costelão Solidário</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Georgia', serif;
      background: #c8b090;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    header {
      background-image:
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
          transparent 1px, transparent 8px
        ),
        linear-gradient(to bottom, #5a2d0c, #3e1f08);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: clamp(10px, 2vw, 16px) clamp(12px, 3vw, 32px);
      gap: clamp(10px, 2vw, 24px);
      min-height: auto;
    }

    .header-logo {
      width: clamp(50px, 8vw, 90px);
      height: clamp(50px, 8vw, 90px);
      flex-shrink: 0;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .header-title {
      color: #f5e6c8;
      font-size: clamp(1rem, 4.5vw, 2.8rem);
      font-weight: bold;
      letter-spacing: 1px;
      flex: 0 1 auto;
      min-width: auto;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      word-break: break-word;
      text-align: center;
    }

    .header-title sup {
      font-size: 0.5em;
      vertical-align: super;
    }

    .header-apoiadores {
      color: #f5e6c8;
      font-size: clamp(0.5rem, 1.2vw, 0.85rem);
      letter-spacing: clamp(0.5px, 0.4vw, 2px);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .apoiador-diamond {
      color: #c8a96e;
      font-size: 0.75em;
    }

    .header-sponsors {
      display: flex;
      gap: clamp(6px, 1.5vw, 14px);
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      order: 4;
    }

    .sponsor-card {
      background: #fff;
      border-radius: 4px;
      padding: clamp(6px, 1vw, 12px) clamp(10px, 1.5vw, 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: clamp(75px, 11vw, 140px);
      min-height: clamp(45px, 7vw, 70px);
      gap: 4px;
      flex: 0 1 auto;
    }

    .sponsor-card img {
      height: clamp(20px, 3.5vw, 40px);
      width: auto;
      object-fit: contain;
    }

    .sponsor-label {
      font-size: clamp(0.4rem, 0.7vw, 0.6rem);
      color: #555;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      line-height: 1.2;
    }

    /* ══════════════════════════════
       STATS BAR
    ══════════════════════════════ */
    .stats-bar {
      background: #c8aa80;
      display: flex;
      justify-content: center;
      gap: clamp(4px, 1.5vw, 12px);
      padding: clamp(10px, 1.5vw, 16px) clamp(12px, 2.5vw, 28px);
      flex-wrap: wrap;
    }

    .stat-box {
      background: #fff;
      border-radius: 6px;
      padding: clamp(6px, 0.8vw, 10px) clamp(14px, 3.5vw, 36px);
      text-align: center;
      flex: 1;
      min-width: clamp(70px, 11vw, 110px);
      max-width: 140px;
    }

    .stat-label {
      font-size: clamp(0.48rem, 0.8vw, 0.65rem);
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .stat-value {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      font-weight: bold;
      color: #3e1f08;
      font-family: 'Georgia', serif;
      line-height: 1.2;
    }

    /* ══════════════════════════════
       MAIN
    ══════════════════════════════ */
    main {
      flex: 1;
      background: #c8b090;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 4vw, 60px) clamp(12px, 3vw, 40px);
      min-height: 50vh;
    }

    .btn-start {
      background: linear-gradient(to bottom, #b87340, #8b4e1e);
      color: #fff;
      font-size: clamp(0.9rem, 3vw, 2rem);
      font-weight: bold;
      letter-spacing: clamp(1px, 0.5vw, 5px);
      font-family: 'Georgia', serif;
      border: none;
      border-radius: clamp(8px, 1.5vw, 16px);
      padding: clamp(14px, 2vw, 32px) clamp(24px, 6vw, 120px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 20px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.3);
      transition: filter 0.15s;
      width: clamp(250px, 85vw, 700px);
      max-width: 95vw;
      flex-wrap: wrap;
    }

    .btn-start:hover  { filter: brightness(1.08); }
    .btn-start:active { filter: brightness(0.92); transform: translateY(1px); }

    .btn-triangle {
      width: 0;
      height: 0;
      border-top: clamp(8px, 1vw, 15px) solid transparent;
      border-bottom: clamp(8px, 1vw, 15px) solid transparent;
      border-left: clamp(12px, 1.5vw, 24px) solid #fff;
      display: inline-block;
      flex-shrink: 0;
    }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    footer {
      background: #c8aa80;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(8px, 1vw, 12px) clamp(12px, 2.5vw, 28px);
      min-height: auto;
      gap: 8px;
      flex-wrap: wrap;
    }

    .footer-spacer { flex: 1; min-width: 0; }

    .footer-center {
      flex: 1;
      text-align: center;
      font-size: clamp(0.5rem, 0.9vw, 0.75rem);
      color: #7a5c3a;
      letter-spacing: clamp(0.5px, 0.3vw, 2px);
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .footer-right {
      flex: 0 1 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      background: #d9c9b0;
      border-radius: 4px;
      padding: clamp(4px, 0.6vw, 8px) clamp(8px, 1.2vw, 16px);
      white-space: nowrap;
    }

    .footer-right span {
      font-size: clamp(0.42rem, 0.75vw, 0.65rem);
      color: #5a3e20;
      font-family: Arial, sans-serif;
      letter-spacing: 0.5px;
    }

    .footer-right img {
      height: clamp(14px, 2.2vw, 22px);
      width: auto;
      object-fit: contain;
    }

    /* ══════════════════════════════
       MOBILE (≤ 600px)
    ══════════════════════════════ */
    @media (max-width: 600px) {
      body { min-height: 100vh; }
      
      header {
        flex-direction: column;
        text-align: center;
        gap: 12px;
        padding: 12px 12px;
      }

      .header-logo { width: 50px; height: 50px; }
      
      .header-title {
        font-size: 1.3rem;
        order: 2;
        width: 100%;
      }

      .header-apoiadores { display: none; }

      .header-sponsors {
        width: 100%;
        order: 3;
        gap: 8px;
      }

      .sponsor-card {
        min-width: 85px;
        min-height: 50px;
        padding: 6px 10px;
      }

      .sponsor-card img { height: 22px; }
      .sponsor-label { font-size: 0.4rem; }

      .stats-bar {
        gap: 6px;
        padding: 10px 8px;
      }

      .stat-box {
        padding: 6px 10px;
        min-width: 65px;
        max-width: 100px;
      }

      .stat-label { font-size: 0.48rem; }
      .stat-value { font-size: 1.1rem; }

      main { padding: 16px 8px; min-height: 45vh; }

      .games-grid { 
        grid-template-columns: 1fr;
        gap: 14px;
        max-width: 100%;
        padding: 0 6px;
      }

      .game-card-costelao-inner {
        padding: 18px 14px;
        min-height: 240px;
        gap: 10px;
      }

      .game-name-costelao { font-size: 1.1rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 38px; }
      .game-desc-costelao { font-size: 0.75rem; }
      .game-btn-costelao { font-size: 0.85rem; padding: 8px 18px; }

      footer { 
        flex-direction: column;
        gap: 6px;
        padding: 8px 8px;
      }
      
      .footer-spacer { display: none; }
      .footer-center { flex: 1; width: 100%; }
      .footer-right { flex: 1; width: 100%; justify-content: center; }
    }

    /* ══════════════════════════════
       TABLET (600px - 1060px)
    ══════════════════════════════ */
    @media (min-width: 601px) and (max-width: 1060px) {
      header { gap: 14px; padding: 12px 18px; }
      .header-sponsors { width: 100%; order: 4; }
      .sponsor-card { min-width: 95px; min-height: 55px; }
      
      .stats-bar { gap: 8px; padding: 12px 16px; }
      .stat-box { min-width: 80px; max-width: 120px; }

      main { padding: 24px 16px; }

      .games-grid { 
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        max-width: 100%;
      }

      .game-card-costelao-inner { padding: 24px 18px; min-height: 260px; }
      .game-name-costelao { font-size: 1.3rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 44px; }
    }

    /* ══════════════════════════════
       TELAS GRANDES (≥ 1920px)
    ══════════════════════════════ */
    @media (min-width: 1920px) {
      header { padding: 18px 60px; min-height: 130px; }
      .header-logo { width: 110px; height: 110px; }
      .header-title { font-size: 3.6rem; }
      .header-apoiadores { font-size: 1rem; letter-spacing: 4px; }
      .sponsor-card { min-width: 180px; min-height: 90px; padding: 12px 22px; }
      .sponsor-card img { height: 52px; }
      .sponsor-label { font-size: 0.72rem; }

      .stats-bar { padding: 18px 60px; gap: 16px; }
      .stat-box { padding: 10px 50px; max-width: 240px; }
      .stat-label { font-size: 0.78rem; }
      .stat-value { font-size: 2.4rem; }

      .btn-start { font-size: 2.4rem; padding: 40px 180px; border-radius: 18px; letter-spacing: 7px; width: 780px; }

      footer { padding: 12px 60px; min-height: 60px; }
      .footer-center { font-size: 0.9rem; letter-spacing: 4px; }
      .footer-right span { font-size: 0.78rem; }
      .footer-right img { height: 30px; }
    }

    /* ══════════════════════════════
       TELAS 4K (≥ 2560px)
    ══════════════════════════════ */
    @media (min-width: 2560px) {
      header { padding: 24px 100px; min-height: 170px; }
      .header-logo { width: 150px; height: 150px; }
      .header-title { font-size: 5rem; }
      .header-apoiadores { font-size: 1.3rem; letter-spacing: 5px; }
      .sponsor-card { min-width: 240px; min-height: 120px; }
      .sponsor-card img { height: 70px; }
      .sponsor-label { font-size: 0.9rem; }

      .stats-bar { padding: 22px 100px; gap: 20px; }
      .stat-box { padding: 14px 70px; max-width: 320px; }
      .stat-label { font-size: 1rem; }
      .stat-value { font-size: 3.2rem; }

      .btn-start { font-size: 3.2rem; padding: 55px 240px; border-radius: 22px; letter-spacing: 9px; width: 1100px; }
      .btn-triangle { border-top-width: 20px; border-bottom-width: 20px; border-left-width: 32px; }

      footer { padding: 16px 100px; min-height: 80px; }
      .footer-center { font-size: 1.2rem; }
      .footer-right span { font-size: 1rem; }
      .footer-right img { height: 40px; }
    }

    /* ══════════════════════════════
       GAMES GRID
    ══════════════════════════════ */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: clamp(14px, 3vw, 28px);
      max-width: 800px;
      width: 100%;
      padding: 0 clamp(8px, 2vw, 20px);
    }

    .game-card-costelao {
      display: block;
      text-decoration: none;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .game-card-costelao:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

    .game-card-costelao-inner {
      background: linear-gradient(135deg, #d9c9b0, #c8aa80);
      border: 2px solid #b87340;
      border-radius: 12px;
      padding: clamp(20px, 4vw, 32px) clamp(16px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vw, 14px);
      min-height: clamp(220px, 50vw, 300px);
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .game-card-costelao:hover .game-card-costelao-inner {
      border-color: #c8a96e;
      background: linear-gradient(135deg, #e8dcc8, #d9c9b0);
    }

    .game-icon-costelao {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      margin-bottom: 0;
    }
    .mark-x {
      font-family: 'Georgia', serif;
      font-size: clamp(40px, 8vw, 52px);
      font-weight: bold;
      color: #ff4d6d;
      text-shadow: 0 0 16px rgba(255,77,109,0.4);
      line-height: 1;
    }
    .mark-o {
      font-family: 'Georgia', serif;
      font-size: clamp(40px, 8vw, 52px);
      font-weight: bold;
      color: #4dd9ff;
      text-shadow: 0 0 16px rgba(77,217,255,0.4);
      line-height: 1;
    }
    .memory-emoji-costelao {
      font-size: clamp(40px, 8vw, 52px);
      filter: drop-shadow(0 0 16px rgba(200,170,128,0.5));
    }

    .game-name-costelao {
      font-family: 'Georgia', serif;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-weight: bold;
      color: #3e1f08;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .game-desc-costelao {
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      color: #5a3e20;
      text-align: center;
      font-family: Arial, sans-serif;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    .game-btn-costelao {
      display: inline-flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      padding: clamp(10px, 1.5vw, 12px) clamp(24px, 4vw, 32px);
      background: linear-gradient(to bottom, #b87340, #8b4e1e);
      color: #fff;
      border-radius: 10px;
      font-family: 'Georgia', serif;
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      font-weight: bold;
      letter-spacing: clamp(1px, 0.5vw, 3px);
      text-transform: uppercase;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), 0 4px 12px rgba(0,0,0,0.25);
      transition: filter 0.15s;
      margin-top: auto;
    }
    .game-card-costelao:hover .game-btn-costelao { filter: brightness(1.08); }

    .btn-triangle-small {
      width: 0; height: 0;
      border-top: clamp(6px, 1vw, 8px) solid transparent;
      border-bottom: clamp(6px, 1vw, 8px) solid transparent;
      border-left: clamp(10px, 1.5vw, 12px) solid #fff;
      display: inline-block;
    }

    /* ══════════════════════════════
       DESKTOP (≥ 1061px)
    ══════════════════════════════ */
    @media (min-width: 1061px) {
      header { 
        justify-content: flex-start;
        gap: 20px;
        padding: 14px 32px;
      }
      
      .header-title { flex: 1; min-width: 150px; }
      .header-apoiadores { display: flex; }
      .header-sponsors { width: auto; order: auto; }
      
      .sponsor-card { min-width: 130px; min-height: 65px; }

      .stats-bar { gap: 16px; padding: 14px 32px; }
      .stat-box { min-width: 110px; max-width: 160px; }

      main { padding: 40px 32px; }

      .games-grid { 
        grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
        gap: 28px;
        max-width: 820px;
      }

      .game-card-costelao-inner { padding: 32px 24px; min-height: 300px; }
      .game-name-costelao { font-size: 1.7rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 52px; }
      .game-btn-costelao { font-size: 1rem; padding: 12px 32px; }

      footer { padding: 10px 32px; }
      .footer-right { gap: 8px; }
      .footer-right span { font-size: 0.65rem; }
      .footer-right img { height: 22px; }
    }

    /* ══════════════════════════════
       LARGE DESKTOP (≥ 1920px)
    ══════════════════════════════ */
    @media (min-width: 1920px) {
      header { padding: 18px 60px; gap: 24px; }
      .header-logo { width: 100px; height: 100px; }
      .header-title { font-size: 3.2rem; }
      .header-apoiadores { font-size: 0.95rem; }
      .sponsor-card { min-width: 160px; min-height: 85px; padding: 10px 20px; }
      .sponsor-card img { height: 48px; }
      .sponsor-label { font-size: 0.65rem; }

      .stats-bar { padding: 16px 60px; gap: 20px; }
      .stat-box { padding: 10px 50px; min-width: 140px; max-width: 200px; }
      .stat-label { font-size: 0.75rem; }
      .stat-value { font-size: 2.2rem; }

      main { padding: 50px 60px; }
      .btn-start { font-size: 2rem; padding: 36px 160px; }

      .games-grid { 
        grid-template-columns: repeat(auto-fit, minmax(320px, 380px));
        gap: 36px;
        max-width: 900px;
      }

      .game-card-costelao-inner { padding: 40px 28px; min-height: 340px; gap: 16px; }
      .game-name-costelao { font-size: 2rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 64px; }
      .game-btn-costelao { font-size: 1.15rem; padding: 14px 40px; letter-spacing: 1px; }

      footer { padding: 12px 60px; }
      .footer-right span { font-size: 0.75rem; }
      .footer-right img { height: 28px; }
    }

    /* ══════════════════════════════
       4K (≥ 2560px)
    ══════════════════════════════ */
    @media (min-width: 2560px) {
      header { padding: 24px 100px; gap: 32px; }
      .header-logo { width: 140px; height: 140px; }
      .header-title { font-size: 4.2rem; }
      .sponsor-card { min-width: 200px; min-height: 110px; padding: 12px 24px; }
      .sponsor-card img { height: 64px; }

      .stats-bar { padding: 20px 100px; gap: 28px; }
      .stat-box { padding: 14px 70px; max-width: 280px; }
      .stat-label { font-size: 0.9rem; }
      .stat-value { font-size: 2.8rem; }

      main { padding: 60px 100px; }
      .btn-start { font-size: 2.6rem; padding: 48px 200px; }

      .games-grid { 
        grid-template-columns: repeat(2, 1fr);
        gap: 48px;
        max-width: 1100px;
      }

      .game-card-costelao-inner { padding: 48px 36px; min-height: 400px; }
      .game-name-costelao { font-size: 2.4rem; }
      .mark-x, .mark-o, .memory-emoji-costelao { font-size: 80px; }

      footer { padding: 16px 100px; }
      .footer-right span { font-size: 0.95rem; }
      .footer-right img { height: 36px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-logo">
      <img src="img/logoCostelao.png" alt="Logo Costelão Solidário" />
    </div>

    <div class="header-title">
      4<sup>o</sup> Costelão Solidário
    </div>

    <div class="header-apoiadores">
      <span class="apoiador-diamond">✦</span>
      APOIADORES
      <span class="apoiador-diamond">✦</span>
    </div>

    <div class="header-sponsors">
      <div class="sponsor-card">
        <img src="img/360.jpg" alt="Silca360 Experiência Interativa" />
        <span class="sponsor-label">Experiência Interativa</span>
      </div>
      <div class="sponsor-card">
        <img src="img/teora.png" alt="Teora Solutions Desenvolvimento" />
        <span class="sponsor-label">Desenvolvimento</span>
      </div>
    </div>
  </header>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-label">Tempo</div>
      <div class="stat-value">75</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Tentativas</div>
      <div class="stat-value">0 / 22</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Pares</div>
      <div class="stat-value">0 / 10</div>
    </div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="games-grid">

      <!-- JOGO DA VELHA -->
